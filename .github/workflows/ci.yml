name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request replaces the run still going.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install SQLite for database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # The generated files are committed, so an .arb change without
      # running gen-l10n would ship stale strings.
      - name: Check generated localizations are committed
        run: |
          if ! git diff --exit-code --stat -- lib/l10n/generated; then
            echo "::error::lib/l10n/generated is out of date. Run 'flutter gen-l10n' and commit the result."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Includes test/legacy_files_test.dart: .btk files from the first app
      # version must still load and export.
      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      # Release builds refuse to run without a signing key. This job makes a
      # throwaway key that exists only for this run, so the release build
      # (with code shrinking, as Play gets it) is checked. It is not the
      # upload key, and nothing built here is kept or published.
      - name: Create a throwaway signing key
        run: |
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-throwaway.jks" \
            -storetype PKCS12 -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$pass" -keypass "$pass" -dname "CN=CI throwaway key"
          {
            echo "BTC_UPLOAD_STORE_FILE=$RUNNER_TEMP/ci-throwaway.jks"
            echo "BTC_UPLOAD_STORE_PASSWORD=$pass"
            echo "BTC_UPLOAD_KEY_ALIAS=ci"
            echo "BTC_UPLOAD_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Remove the throwaway key
        if: always()
        run: rm -f "$RUNNER_TEMP/ci-throwaway.jks"

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Same command as the GitHub Pages deploy, so a pull request that
      # would break the live Web app fails here first.
      - name: Build Web release
        run: flutter build web --release --base-href /
