name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/btk-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=btk-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build APKs (split by ABI)
        run: flutter build apk --split-per-abi --release

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk    btk-android-arm64.apk
          cp app-armeabi-v7a-release.apk  btk-android-arm32.apk
          cp app-x86_64-release.apk       btk-android-x86_64.apk

      - name: SHA256 checksums (Android)
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum btk-android-arm64.apk btk-android-arm32.apk btk-android-x86_64.apk \
            > checksums-android.txt
          cat checksums-android.txt

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BTC Field App ${{ github.ref_name }}"
          files: |
            build/app/outputs/flutter-apk/btk-android-arm64.apk
            build/app/outputs/flutter-apk/btk-android-arm32.apk
            build/app/outputs/flutter-apk/btk-android-x86_64.apk
            build/app/outputs/flutter-apk/checksums-android.txt
          body: |
            ## ბტკ საველე აპლიკაცია ${{ github.ref_name }}

            ### Android
            | ფაილი | არქიტექტურა |
            |---|---|
            | `btk-android-arm64.apk` | arm64-v8a — თანამედროვე ტელეფონები (რეკომენდირებული) |
            | `btk-android-arm32.apk` | armeabi-v7a — ძველი ტელეფონები |
            | `btk-android-x86_64.apk` | x86_64 — ემულატორები |

            Settings → Install unknown apps → ჩართეთ

            ### Windows
            1. ჩამოტვირთეთ `btk-windows.zip`
            2. გახსენით zip და გაუშვით `btk_field_app.exe`

            ### Linux
            | ფაილი | გამოყენება |
            |---|---|
            | `btk-linux-X.Y.Z.AppImage` | ნებისმიერი distro — chmod +x და გაუშვით |
            | `btk-linux-X.Y.Z.deb` | Debian / Ubuntu |
            | `btk-linux-X.Y.Z.rpm` | Fedora / RHEL / openSUSE |

            ```bash
            # AppImage (universalური)
            chmod +x btk-linux-*.AppImage && ./btk-linux-*.AppImage

            # Debian/Ubuntu
            sudo dpkg -i btk-linux-*.deb && sudo apt-get install -f

            # Fedora/RHEL
            sudo dnf install btk-linux-*.rpm
            ```

            ### SHA256 Checksums
            იხილეთ `checksums-android.txt`, `checksums-windows.txt`, `checksums-linux.txt`

            ### ცვლილებები
            ${{ github.event.head_commit.message }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Enable Developer Mode
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
        shell: cmd

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows build
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath btk-windows.zip

      - name: SHA256 checksum (Windows)
        run: |
          $hash = (Get-FileHash btk-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  btk-windows.zip" | Out-File -Encoding utf8 checksums-windows.txt
          Get-Content checksums-windows.txt

      - name: Upload Windows build to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            btk-windows.zip
            checksums-windows.txt

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            cmake ninja-build clang alien

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Linux
        run: flutter build linux --release

      - name: Extract version
        id: ver
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_OUTPUT

      - name: Package .deb
        run: |
          V=${{ steps.ver.outputs.VERSION }}
          PKG=btk-field-app_${V}_amd64
          mkdir -p ${PKG}/DEBIAN
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/lib/btk-field-app
          mkdir -p ${PKG}/usr/share/applications

          cp -r build/linux/x64/release/bundle/. ${PKG}/usr/lib/btk-field-app/

          printf '#!/bin/bash\nexec /usr/lib/btk-field-app/btk_field_app "$@"\n' \
            > ${PKG}/usr/bin/btk-field-app
          chmod +x ${PKG}/usr/bin/btk-field-app

          cat > ${PKG}/usr/share/applications/btk-field-app.desktop <<'DESKTOP'
[Desktop Entry]
Name=BTK Field App
Comment=Georgian landscape field survey tool
Exec=/usr/bin/btk-field-app
Terminal=false
Type=Application
Categories=Science;Geography;
DESKTOP

          cat > ${PKG}/DEBIAN/control <<CONTROL
Package: btk-field-app
Version: ${V}
Section: science
Priority: optional
Architecture: amd64
Depends: libgtk-3-0, libblkid1, liblzma5, libsecret-1-0
Maintainer: Georgian Cartographers Association <info@gca.ge>
Description: BTK Field App
 Georgian landscape field survey tool.
CONTROL

          dpkg-deb --build ${PKG}
          mv ${PKG}.deb btk-linux-${V}.deb

      - name: Convert .deb → .rpm
        run: |
          V=${{ steps.ver.outputs.VERSION }}
          sudo alien --rpm btk-linux-${V}.deb
          mv btk-field-app-*.x86_64.rpm btk-linux-${V}.rpm 2>/dev/null || \
          mv btk-field-app_*.x86_64.rpm btk-linux-${V}.rpm

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Package AppImage
        run: |
          V=${{ steps.ver.outputs.VERSION }}
          APPDIR=BTKFieldApp.AppDir
          mkdir -p ${APPDIR}/usr/lib/btk-field-app

          cp -r build/linux/x64/release/bundle/. ${APPDIR}/usr/lib/btk-field-app/

          cat > ${APPDIR}/AppRun <<'APPRUN'
#!/bin/bash
HERE="$(dirname "$(readlink -f "${0}")")"
exec "${HERE}/usr/lib/btk-field-app/btk_field_app" "$@"
APPRUN
          chmod +x ${APPDIR}/AppRun

          cat > ${APPDIR}/btk-field-app.desktop <<'DESKTOP'
[Desktop Entry]
Name=BTK Field App
Comment=Georgian landscape field survey tool
Exec=btk-field-app
Icon=btk-field-app
Terminal=false
Type=Application
Categories=Science;Geography;
DESKTOP

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             ${APPDIR}/btk-field-app.png

          ARCH=x86_64 ./appimagetool-x86_64.AppImage \
            --appimage-extract-and-run \
            ${APPDIR} btk-linux-${V}.AppImage

      - name: SHA256 checksums (Linux)
        run: |
          V=${{ steps.ver.outputs.VERSION }}
          sha256sum btk-linux-${V}.deb btk-linux-${V}.rpm btk-linux-${V}.AppImage \
            > checksums-linux.txt
          cat checksums-linux.txt

      - name: Upload Linux builds to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            btk-linux-*.deb
            btk-linux-*.rpm
            btk-linux-*.AppImage
            checksums-linux.txt
