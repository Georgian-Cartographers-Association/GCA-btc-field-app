name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/btk-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=btk-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: "BTC Field App ${{ github.ref_name }}"
          body: |
            ## ბტკ საველე აპლიკაცია ${{ github.ref_name }}

            ### Android
            1. ჩამოტვირთეთ `app-release.apk`
            2. Settings → Install unknown apps → ჩართეთ
            3. APK გაუშვით

            ### Windows
            1. ჩამოტვირთეთ `btk-windows.zip`
            2. გახსენით zip და გაუშვით `btk_field_app.exe`

            ### Linux — Debian/Ubuntu
            ```bash
            sudo dpkg -i btk-linux-*.deb && sudo apt-get install -f
            ```

            ### Linux — Fedora/RHEL
            ```bash
            sudo dnf install btk-linux-*.rpm
            ```

            ### ცვლილებები
            ${{ github.event.head_commit.message }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Enable Developer Mode (symlink support for Flutter plugins)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
        shell: cmd

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows build
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath btk-windows.zip

      - name: Upload Windows build to Release
        uses: softprops/action-gh-release@v2
        with:
          files: btk-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            cmake ninja-build clang alien

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Linux
        run: flutter build linux --release

      - name: Extract version
        id: ver
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_OUTPUT

      - name: Package .deb
        run: |
          V=${{ steps.ver.outputs.VERSION }}
          PKG=btk-field-app_${V}_amd64
          mkdir -p ${PKG}/DEBIAN
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/lib/btk-field-app
          mkdir -p ${PKG}/usr/share/applications

          cp -r build/linux/x64/release/bundle/. ${PKG}/usr/lib/btk-field-app/

          printf '#!/bin/bash\nexec /usr/lib/btk-field-app/btk_field_app "$@"\n' \
            > ${PKG}/usr/bin/btk-field-app
          chmod +x ${PKG}/usr/bin/btk-field-app

          cat > ${PKG}/usr/share/applications/btk-field-app.desktop <<EOF
          [Desktop Entry]
          Name=BTK Field App
          Comment=Georgian landscape field survey tool
          Exec=/usr/bin/btk-field-app
          Terminal=false
          Type=Application
          Categories=Science;Geography;
          EOF

          cat > ${PKG}/DEBIAN/control <<EOF
          Package: btk-field-app
          Version: ${V}
          Section: science
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libblkid1, liblzma5, libsecret-1-0
          Maintainer: Georgian Cartographers Association <info@gca.ge>
          Description: BTK Field App
           Georgian landscape field survey tool.
          EOF

          dpkg-deb --build ${PKG}
          mv ${PKG}.deb btk-linux-${V}.deb

      - name: Convert .deb → .rpm
        run: |
          V=${{ steps.ver.outputs.VERSION }}
          sudo alien --rpm btk-linux-${V}.deb
          mv btk-field-app-*.x86_64.rpm btk-linux-${V}.rpm || \
          mv btk-field-app_*.x86_64.rpm btk-linux-${V}.rpm

      - name: Upload Linux builds to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            btk-linux-*.deb
            btk-linux-*.rpm
          body: |
            ### Linux ინსტალაცია

            **Debian/Ubuntu (.deb):**
            ```bash
            sudo dpkg -i btk-linux-VERSION.deb
            sudo apt-get install -f   # dependencies
            ```

            **Fedora/RHEL (.rpm):**
            ```bash
            sudo rpm -i btk-linux-VERSION.rpm
            # ან
            sudo dnf install btk-linux-VERSION.rpm
            ```
